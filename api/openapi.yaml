openapi: 3.0.3
info:
  title: ViajesPlus API
  version: "1.1 (Sprint 2)"
  description: |
    Contrato de la API de ViajesPlus (D06, Puerta 2). Cubre lo comprometido en el Sprint 1:
    autenticación con el proveedor OIDC simulado (IMP-01), catálogo, cotización, solicitud y consulta de
    reservas, y auditoría. Los errores de negocio responden 422 con { "code", "message", "details" };
    un recurso ajeno o un rol sin permiso responde 403 (ACCESO_DENEGADO); sin token, 401 (NO_AUTENTICADO).
    Sprint 2 (spec v1.0.1): confirmar y rechazar (agente), disponibilidad del proveedor, asignación de hotel,
    guía y conductor (coordinador) y avisos. Desde la v1.0.1 la solicitud ocupa cupo (RN-02) y responde
    CUPO_INSUFICIENTE si no hay plazas. La cancelación (cancel) se agrega en el Sprint 3.
servers:
  - url: /
security:
  - bearer: []
paths:
  /api/auth/token:
    post:
      tags: [Autenticación]
      summary: Obtener un token del proveedor OIDC simulado (HU-06)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200': { description: Token emitido, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { description: CREDENCIALES_INVALIDAS, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/auth/jwks:
    get:
      tags: [Autenticación]
      summary: Llaves públicas del proveedor simulado
      security: []
      responses:
        '200': { description: JWKS }
  /api/packages:
    get:
      tags: [Paquetes]
      summary: Listar paquetes activos con sus próximas salidas
      security: []
      responses:
        '200': { description: Lista de paquetes, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Package' } } } } }
  /api/packages/{id}:
    get:
      tags: [Paquetes]
      summary: Detalle de un paquete
      security: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Paquete, content: { application/json: { schema: { $ref: '#/components/schemas/Package' } } } }
        '404': { description: NO_ENCONTRADO }
  /api/packages/{id}/quote:
    get:
      tags: [Paquetes]
      summary: Cotizar un paquete (REQ-VIA-001, REQ-VIA-002)
      description: Total = tarifa por persona × viajeros (RN-01). Roles Cliente, Asesor y Agente.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: travelers, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Cotización, content: { application/json: { schema: { $ref: '#/components/schemas/Quote' } } } }
        '422': { description: DATOS_INVALIDOS (travelers menor que 1), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: ACCESO_DENEGADO }
  /api/reservations:
    post:
      tags: [Reservas]
      summary: Solicitar una reserva (REQ-VIA-003)
      description: Rol Cliente. La reserva queda PENDIENTE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationRequest' }
      responses:
        '201': { description: Reserva creada en PENDIENTE, content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } } }
        '422': { description: DATOS_INVALIDOS con el campo en details, o CUPO_INSUFICIENTE (RN-02), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: ACCESO_DENEGADO (rol distinto de Cliente) }
    get:
      tags: [Reservas]
      summary: Listar reservas (REQ-VIA-012)
      description: El cliente ve solo las suyas; guía y conductor, las asignadas; asesor, agente, coordinador, gerente y administrador ven todas. Con status=PENDIENTE el agente recibe su bandeja ordenada por fecha de salida (HU-16).
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDIENTE, CONFIRMADA, RECHAZADA, CANCELADA] } }
      responses:
        '200': { description: Reservas, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Reservation' } } } } }
  /api/reservations/{id}:
    get:
      tags: [Reservas]
      summary: Detalle de una reserva (REQ-VIA-012)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Reserva, content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } } }
        '403': { description: ACCESO_DENEGADO (reserva de otro cliente) }
        '404': { description: NO_ENCONTRADO }
  /api/reservations/{id}/confirm:
    post:
      tags: [Reservas]
      summary: Confirmar una reserva (REQ-VIA-006, REQ-VIA-007)
      description: Rol Agente. Exige 5 días o más de antelación (RN-04) y un hotel con disponibilidad confirmada (RN-05). Avisa al cliente.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Reserva CONFIRMADA, content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } } }
        '422': { description: ANTELACION_INSUFICIENTE, SIN_DISPONIBILIDAD o ESTADO_INVALIDO, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: ACCESO_DENEGADO (rol distinto de Agente) }
  /api/reservations/{id}/reject:
    post:
      tags: [Reservas]
      summary: Rechazar una reserva (REQ-VIA-008)
      description: Rol Agente. Exige motivo, libera el cupo y avisa al cliente.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string, example: Sin disponibilidad de vuelos } } }
      responses:
        '200': { description: Reserva RECHAZADA, content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } } }
        '422': { description: MOTIVO_OBLIGATORIO o ESTADO_INVALIDO, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: ACCESO_DENEGADO }
  /api/reservations/{id}/assignment:
    put:
      tags: [Reservas]
      summary: Asignar hotel, guía y conductor (REQ-VIA-009)
      description: Rol Coordinador. Solo reservas CONFIRMADA; hotel con disponibilidad confirmada (RN-05); sin cruces de guía o conductor el mismo día (RN-06). Avisa al guía, al conductor y al cliente.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentRequest' }
      responses:
        '200': { description: Reserva asignada, content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } } }
        '422': { description: HOTEL_SIN_DISPONIBILIDAD, CRUCE_GUIA, CRUCE_CONDUCTOR, ESTADO_INVALIDO o DATOS_INVALIDOS, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: ACCESO_DENEGADO }
  /api/reservations/{id}/assignment-options:
    get:
      tags: [Reservas]
      summary: Hoteles con disponibilidad confirmada, guías y conductores para asignar
      description: Rol Coordinador.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Opciones de asignación }
        '403': { description: ACCESO_DENEGADO }
  /api/providers/availability:
    get:
      tags: [Proveedor de hoteles]
      summary: Disponibilidad de mis hoteles por salida (HU-20)
      description: Rol Proveedor.
      responses:
        '200': { description: Disponibilidad, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Availability' } } } } }
    put:
      tags: [Proveedor de hoteles]
      summary: Informar disponibilidad y tarifa (HU-20, RN-05)
      description: Rol Proveedor. Un hotel de otro proveedor responde 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilityRequest' }
      responses:
        '200': { description: Disponibilidad guardada, content: { application/json: { schema: { $ref: '#/components/schemas/Availability' } } } }
        '422': { description: DATOS_INVALIDOS }
        '403': { description: ACCESO_DENEGADO }
  /api/notifications:
    get:
      tags: [Avisos]
      summary: Mis avisos (NFR-VIA-003)
      description: Avisos por correo enviados al usuario autenticado (simulado en el entorno de pruebas).
      responses:
        '200': { description: Avisos }
  /api/audit:
    get:
      tags: [Auditoría]
      summary: Cambios de estado auditados (REQ-VIA-011)
      description: Roles Gerente y Administrador.
      parameters:
        - { name: reservation, in: query, required: false, schema: { type: string, example: RES-00001 } }
      responses:
        '200': { description: Registros de auditoría, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } } } } }
        '403': { description: ACCESO_DENEGADO }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
  schemas:
    ApiError:
      type: object
      properties:
        code: { type: string, example: DATOS_INVALIDOS }
        message: { type: string }
        details: { type: object, additionalProperties: { type: string } }
    TokenRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: cliente@viajesplus.co }
        password: { type: string }
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer }
        role: { type: string, example: CLIENTE }
        name: { type: string }
    Departure:
      type: object
      properties:
        date: { type: string, format: date }
        capacity: { type: integer }
        availableSeats: { type: integer }
    Package:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: CTG-01 }
        name: { type: string }
        destination: { type: string }
        description: { type: string }
        days: { type: integer }
        pricePerPerson: { type: number, example: 1200000 }
        departures: { type: array, items: { $ref: '#/components/schemas/Departure' } }
    Quote:
      type: object
      properties:
        packageId: { type: integer, format: int64 }
        packageName: { type: string }
        pricePerPerson: { type: number, example: 1200000 }
        travelers: { type: integer, example: 3 }
        total: { type: number, example: 3600000 }
    ReservationRequest:
      type: object
      required: [packageId, departureDate, travelers]
      properties:
        packageId: { type: integer, format: int64 }
        departureDate: { type: string, format: date, example: "2027-01-15" }
        travelers: { type: integer, minimum: 1, example: 3 }
    Reservation:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: RES-00001 }
        packageId: { type: integer, format: int64 }
        packageName: { type: string }
        departureDate: { type: string, format: date }
        travelers: { type: integer }
        pricePerPerson: { type: number }
        total: { type: number }
        status: { type: string, enum: [PENDIENTE, CONFIRMADA, RECHAZADA, CANCELADA] }
        clientUsername: { type: string }
        createdAt: { type: string, format: date-time }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        rejectionReason: { type: string, nullable: true }
        hotelName: { type: string, nullable: true }
        guideUsername: { type: string, nullable: true }
        driverUsername: { type: string, nullable: true }
    AssignmentRequest:
      type: object
      required: [hotelId, guideUsername, driverUsername]
      properties:
        hotelId: { type: integer, format: int64 }
        guideUsername: { type: string, example: guia@viajesplus.co }
        driverUsername: { type: string, example: conductor@viajesplus.co }
    Availability:
      type: object
      properties:
        hotelId: { type: integer, format: int64 }
        hotelName: { type: string }
        departureId: { type: integer, format: int64 }
        departureDate: { type: string, format: date }
        rooms: { type: integer }
        ratePerNight: { type: number }
        confirmed: { type: boolean }
    AvailabilityRequest:
      type: object
      required: [hotelId, departureId, rooms, ratePerNight, confirmed]
      properties:
        hotelId: { type: integer, format: int64 }
        departureId: { type: integer, format: int64 }
        rooms: { type: integer, minimum: 0 }
        ratePerNight: { type: number, minimum: 0 }
        confirmed: { type: boolean }
    AuditEntry:
      type: object
      properties:
        entityType: { type: string, example: RESERVA }
        entityId: { type: string, example: RES-00001 }
        action: { type: string, example: SOLICITAR }
        fromStatus: { type: string, nullable: true }
        toStatus: { type: string }
        username: { type: string }
        occurredAt: { type: string, format: date-time }
        reason: { type: string }
