<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · ViajesPlus'">ViajesPlus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand barra">
    <div class="container">
        <a class="navbar-brand marca" th:href="@{/}">ViajesPlus</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/}">Paquetes</a></li>
            <li class="nav-item" sec:authorize="hasRole('CLIENTE')"><a class="nav-link" th:href="@{/reservas}">Mis reservas</a></li>
            <li class="nav-item" sec:authorize="hasRole('ASESOR')"><a class="nav-link" th:href="@{/asesor/cotizar}">Cotizar</a></li>
            <li class="nav-item" sec:authorize="hasAnyRole('GERENTE','ADMIN')"><a class="nav-link" th:href="@{/auditoria}">Auditoría</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/swagger-ui.html}">API</a></li>
        </ul>
        <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
            <span class="navbar-text small" sec:authentication="name">usuario</span>
            <form th:action="@{/salir}" method="post"><button class="btn btn-sm btn-light">Salir</button></form>
        </div>
        <a sec:authorize="!isAuthenticated()" class="btn btn-sm btn-light" th:href="@{/login}">Iniciar sesión</a>
    </div>
</nav>
<footer th:fragment="pie" class="pie mt-5 py-4">
    <div class="container">ViajesPlus · Sprint 1 · Entorno de pruebas con datos ficticios</div>
</footer>
</body>
</html>
